[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mxbess"
version = "0.1.0"
description = "Maximo Manage data-quality and maintenance reporting toolkit for a synthetic BESS site"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anirudh Babu" }]
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "ruff>=0.6",
]

[project.scripts]
mxbess = "mxbess.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mxbess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: integration tests that need a real Maximo instance (skipped by default)",
]
filterwarnings = ["error::DeprecationWarning:mxbess.*"]

[tool.coverage.run]
source = ["src/mxbess"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]
